<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voxel Pagoda Garden — relax</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b1116}
  canvas{position:fixed;inset:0;display:block;cursor:grab;touch-action:none}
  #hint{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);
        color:#eaf1f6;font:12px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;
        padding:5px 10px;border-radius:9px;background:rgba(14,20,26,.42);
        opacity:.65;pointer-events:none;transition:opacity 1s ease}
  #ui{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
      display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:15px;
      background:rgba(14,20,26,.52);border:1px solid rgba(255,255,255,.13);
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      color:#e9eff3;font:13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;
      opacity:0;transition:opacity .45s ease;pointer-events:none;white-space:nowrap;
      width:max-content;max-width:calc(100vw - 20px);flex-wrap:wrap;justify-content:center}
  @media (max-width:620px){
    #ui{gap:7px 8px;padding:7px 9px;font-size:12px}
    #hour{width:78px}
    #vol{display:none}
    #hint{display:none}
  }
  #ui.show{opacity:1;pointer-events:auto}
  #places{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);width:max-content;
      display:flex;flex-direction:column;gap:3px;padding:7px;border-radius:13px;
      background:rgba(14,20,26,.74);border:1px solid rgba(255,255,255,.14);
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      font:13px/1 system-ui,-apple-system,"Segoe UI",sans-serif;z-index:5;
      box-shadow:0 14px 34px rgba(0,0,0,.38)}
  #places[hidden]{display:none}
  #places button{text-align:left;border:0;background:transparent;color:#cfdae2;
      padding:7px 12px;border-radius:8px;min-width:136px;white-space:nowrap}
  #places button:hover{background:rgba(255,255,255,.12);color:#fff}
  #places button[aria-current="true"]{color:#f4e2b4;background:rgba(232,203,132,.12)}
  @media (max-width:620px){ #places{bottom:132px} }
  #info{position:fixed;top:14px;left:14px;z-index:6;min-width:170px;
      background:rgba(14,20,26,.55);border:1px solid rgba(255,255,255,.13);border-radius:13px;
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      color:#e9eff3;font:12.5px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;
      box-shadow:0 10px 26px rgba(0,0,0,.28)}
  #infoHead{display:flex;align-items:center;gap:8px;width:100%;padding:8px 11px;
      background:transparent;border:0;color:inherit;font:inherit;cursor:pointer;text-align:left;border-radius:0}
  #infoHead:hover{background:rgba(255,255,255,.07)}
  #infoRefresh{background:transparent;border:0;color:#93a6b3;font:inherit;line-height:1;
      padding:1px 3px;margin:0;cursor:pointer;border-radius:6px;display:inline-flex;align-items:center}
  #infoRefresh:hover:not(:disabled){color:#fff;background:rgba(255,255,255,.12)}
  #infoRefresh:disabled{opacity:.28;cursor:default}
  #infoRefresh.spin{animation:info-spin .9s linear infinite}
  @keyframes info-spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ #infoRefresh.spin{animation:none} }
  #infoPlace{flex:auto;color:#cfdae2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #infoClock{font-variant-numeric:tabular-nums;color:#f4e2b4}
  #info .chev{font-size:9px;color:#93a6b3;transition:transform .18s}
  #info:not(.closed) .chev{transform:rotate(180deg)}
  #infoBody{padding:0 11px 9px;display:flex;flex-direction:column;gap:3px}
  #info.closed #infoBody{display:none}
  #infoBody .row{display:flex;gap:6px;align-items:baseline}
  #infoBody .muted{color:#93a6b3;font-size:11.5px;line-height:1.35}
  @media (max-width:620px){ #info{top:10px;left:10px;min-width:150px} }
  /* the way back to the city page: the bar's glass, top-right, out of the way */
  #backCity{position:fixed;top:14px;right:14px;z-index:6;display:inline-flex;align-items:center;
      padding:6px 11px;border-radius:999px;color:#cfdae2;text-decoration:none;
      background:rgba(14,20,26,.52);border:1px solid rgba(255,255,255,.13);
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      font:12.5px/1 system-ui,-apple-system,"Segoe UI",sans-serif;
      box-shadow:0 8px 20px rgba(0,0,0,.22);transition:background .15s,color .15s}
  #backCity:hover{background:rgba(255,255,255,.13);color:#fff}
  #backCity:focus-visible{outline:2px solid #e8cb84;outline-offset:2px}
  #backCity[hidden]{display:none}
  @media (max-width:620px){ #backCity{top:10px;right:10px;padding:5px 9px;font-size:11.5px} }
  #ui .lbl{color:#93a6b3;font-size:12px}
  .grp{display:flex;align-items:center;gap:8px}
  input[type=range]{-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;
      background:rgba(255,255,255,.22);outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
      background:#e8cb84;box-shadow:0 0 0 4px rgba(232,203,132,.14);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#e8cb84}
  #hour{width:104px}
  #vol{width:62px}
  button{font:inherit;color:#cfdae2;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
      border-radius:9px;padding:5px 9px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
  button:hover{background:rgba(255,255,255,.13);color:#fff}
  button[aria-pressed="true"]{background:rgba(232,203,132,.18);border-color:rgba(232,203,132,.45);color:#f4e2b4}
  #clock{font-variant-numeric:tabular-nums;color:#cfdae2;min-width:42px;text-align:center}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hint">drag to look &middot; scroll to zoom &middot; enable sound for ambience</div>

<div id="ui">
  <div class="grp">
    <span class="lbl">time</span>
    <input id="hour" type="range" min="0" max="24" step="0.05" value="16.6" aria-label="Time of day">
    <span id="clock">16:36</span>
    <button id="cycle" aria-pressed="true" title="Slow day and night cycle">cycle</button>
  </div>
  <div class="grp">
    <button id="place" aria-haspopup="true" aria-expanded="false" title="Match a city's time and weather">location</button>
  </div>
  <div class="grp">
    <button data-wx="clear" aria-pressed="true">clear</button>
    <button data-wx="rain" aria-pressed="false">rain</button>
    <button data-wx="snow" aria-pressed="false">snow</button>
  </div>
  <div class="grp">
    <button id="zout" aria-label="Zoom out" title="Zoom out (scroll)">&minus;</button>
    <button id="zin" aria-label="Zoom in" title="Zoom in (scroll)">+</button>
  </div>
  <div class="grp">
    <button id="snd" aria-pressed="false">sound</button>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="0.18" aria-label="Volume">
  </div>
</div>

<div id="places" hidden>
  <button data-place="local">Own time</button>
  <button data-place="0">Vancouver</button>
  <button data-place="1">Toronto</button>
  <button data-place="2">Hawai&lsquo;i</button>
  <button data-place="3">Hong Kong</button>
  <button data-place="4">Amsterdam</button>
</div>

<div id="info">
  <div id="infoHead" role="button" tabindex="0" aria-expanded="false" title="Location, weather and time">
    <span id="infoPlace">Own time</span>
    <span id="infoClock">--:--</span>
    <button id="infoRefresh" aria-label="Refresh weather" title="Refresh weather now">&#8635;</button>
    <span class="chev" aria-hidden="true">&#9660;</span>
  </div>
  <div id="infoBody">
    <div class="row"><span id="infoCond">Clear sky</span><span id="infoTemp"></span></div>
    <div class="row muted" id="infoMeta"></div>
    <div class="row muted" id="infoScene" hidden></div>
  </div>
</div>

<a id="backCity" href="../" hidden>&larr; back to the city</a>

<script>
"use strict";

/* ------------------------------------------------------------------ canvas */
const cv = document.getElementById("scene");
const ctx = cv.getContext("2d", { alpha: false });
let W = 0, H = 0, DPR = 1, vignette = null;

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isFirefox = /firefox/i.test(navigator.userAgent);

// The expensive part of a frame is the ~830 voxel faces. They only change when the
// camera, the clock or the weather does, so they are painted into an offscreen layer
// and the animation loop just blits it and draws the moving bits on top.
const layer = document.createElement("canvas");
let lctx = layer.getContext("2d", { alpha: false });
let vignetteCv = null;
let cacheState = null;

function resize(){
  // Firefox's 2-D path filling is slower than Chromium's, so give it, and everyone
  // at high DPI, a slightly smaller backing store instead of 2x pixels.
  DPR = Math.min(window.devicePixelRatio || 1, isFirefox ? 1.25 : 1.5);
  W = cv.width  = Math.max(1, Math.floor(innerWidth  * DPR));
  H = cv.height = Math.max(1, Math.floor(innerHeight * DPR));
  cv.style.width  = innerWidth  + "px";
  cv.style.height = innerHeight + "px";
  layer.width = W; layer.height = H;
  lctx = layer.getContext("2d", { alpha: false });

  vignetteCv = document.createElement("canvas");
  vignetteCv.width = W; vignetteCv.height = H;
  const vg = vignetteCv.getContext("2d");
  const vgrad = vg.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.22,
                                        W / 2, H / 2, Math.max(W, H) * 0.75);
  vgrad.addColorStop(0, "rgba(0,0,0,0)");
  vgrad.addColorStop(1, "rgba(5,9,13,0.45)");
  vg.fillStyle = vgrad;
  vg.fillRect(0, 0, W, H);

  cacheState = null;
  seedParticles();
}
addEventListener("resize", resize);

/* ------------------------------------------------------------------- world */
// The garden is voxels from one small vocabulary: a 22x22 plot, water, a path,
// trees and the pagoda. Its arrays and its camera fit are derived once, at load.
const COL = {
  grassA:"#68a84c", grassB:"#74b855",
  stone:"#969599", stoneTop:"#a5a4a9", path:"#a39c8d",
  water:"#2e6f9f", lily:"#3e8f4f", flower:"#e881a6",
  wall:"#efe6cf", roof:"#8a2f26", gold:"#d6b03c", door:"#46302a",
  trunk:"#6d4a2f", leaf:"#3d7b36", leaf2:"#4c9044"
};

// faces: 0 +x, 1 -x, 2 +z, 3 -z, 4 top; fixed light so both sides read from any angle
// (the -z normal used to be 0, which hid every -z face: the neighbour probe hit the
//  cube itself and the back-face test read 0 <= 0)
const NX = [1, -1, 0, 0, 0];
const NY = [0, 0, 0, 0, 1];
const NZ = [0, 0, 1, -1, 0];
const FB = [0.84, 0.60, 0.72, 0.52, 1.00];
const shadeCache = new Map();

function shade(col, f){
  const key = col + "|" + f;
  let str = shadeCache.get(key);
  if(str === undefined){
    const b = FB[f];
    str = "rgb(" + Math.round(Math.min(255, parseInt(col.slice(1, 3), 16) * b)) + "," +
                  Math.round(Math.min(255, parseInt(col.slice(3, 5), 16) * b)) + "," +
                  Math.round(Math.min(255, parseInt(col.slice(5, 7), 16) * b)) + ")";
    shadeCache.set(key, str);
  }
  return str;
}

// `build` fills the voxel list; the plot is then centred and fitted to the screen.
function makeScene(name, lamps, build){
  const vox = [], seen = new Set();
  const put = (x, y, z, c) => {
    const k = x + "," + y + "," + z;
    if(!seen.has(k)){ seen.add(k); vox.push([x, y, z, c]); }
  };
  const rep = (x, y, z, c) => {
    for(let i = 0; i < vox.length; i++){
      const v = vox[i];
      if(v[0] === x && v[1] === y && v[2] === z){ v[3] = c; return; }
    }
  };
  build({ put, rep });

  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity, minZ = Infinity, maxZ = -Infinity;
  for(const v of vox){
    if(v[0] < minX) minX = v[0];
    if(v[0] > maxX) maxX = v[0];
    if(v[1] < minY) minY = v[1];
    if(v[1] > maxY) maxY = v[1];
    if(v[2] < minZ) minZ = v[2];
    if(v[2] > maxZ) maxZ = v[2];
  }
  const cx = (minX + maxX + 1) / 2, cy = (minY + maxY + 1) / 2, cz = (minZ + maxZ + 1) / 2;
  const extX = maxX + 1 - minX, extY = maxY + 1 - minY, extZ = maxZ + 1 - minZ;
  const fit = Math.max(extX, extZ, extY * 1.35) + 6;

  const n = vox.length;
  const pos = new Float64Array(n * 6);
  const occ = new Uint8Array(n);
  const cols = new Array(n);
  for(let i = 0; i < n; i++){
    const v = vox[i], j = i * 6;
    pos[j]     = v[0] - cx;  pos[j + 1] = v[0] + 1 - cx;
    pos[j + 2] = v[1] - cy;  pos[j + 3] = v[1] + 1 - cy;
    pos[j + 4] = v[2] - cz;  pos[j + 5] = v[2] + 1 - cz;

    const cl = [];
    for(let f = 0; f < 5; f++) cl.push(shade(v[3], f));
    cols[i] = cl;

    let m = 0;
    for(let f = 0; f < 5; f++){
      if(seen.has((v[0] + NX[f]) + "," + (v[1] + NY[f]) + "," + (v[2] + NZ[f]))) m |= (1 << f);
    }
    occ[i] = m;
  }

  const FC = new Float64Array(n * 15);
  for(let i = 0; i < n; i++){
    const j = i * 6, b = i * 15;
    const X0 = pos[j], X1 = pos[j + 1], Y0 = pos[j + 2], Y1 = pos[j + 3], Z0 = pos[j + 4], Z1 = pos[j + 5];
    const xm = (X0 + X1) * 0.5, ym = (Y0 + Y1) * 0.5, zm = (Z0 + Z1) * 0.5;
    FC[b]      = X1; FC[b + 1]  = ym; FC[b + 2]  = zm;
    FC[b + 3]  = X0; FC[b + 4]  = ym; FC[b + 5]  = zm;
    FC[b + 6]  = xm; FC[b + 7]  = ym; FC[b + 8]  = Z1;
    FC[b + 9]  = xm; FC[b + 10] = ym; FC[b + 11] = Z0;
    FC[b + 12] = xm; FC[b + 13] = Y1; FC[b + 14] = zm;
  }

  const pts = new Float64Array(n * 12);
  const faceIdx = new Int32Array(n * 5);
  const faceDepth = new Float64Array(n * 5);
  const faceOrder = new Array(n * 5);
  for(let k = 0; k < n * 5; k++) faceOrder[k] = k;

  return {
    name, lamps: lamps || [], vox, n, pos, occ, cols, FC, pts, faceIdx, faceDepth, faceOrder,
    cx, cy, cz, fit, byFaceDepth: (a, b) => faceDepth[a] - faceDepth[b]
  };
}

/* ------------------------------------------------------------ garden pieces */
function plot(P, opts){
  const { water, path, g1, g2, edge } = opts;
  const waterSet = new Set(water), pathSet = new Set(path);
  for(let x = 0; x < 22; x++){
    for(let z = 0; z < 22; z++){
      const k = x + "," + z;
      if(waterSet.has(k)){ P.put(x, 0, z, COL.water); continue; }
      if(pathSet.has(k)){ P.put(x, 0, z, edge || COL.path); continue; }
      P.put(x, 0, z, ((x + z) & 1) ? g1 : g2);
    }
  }
}
const box = (x0, z0, x1, z1) => {
  const out = [];
  for(let x = x0; x <= x1; x++) for(let z = z0; z <= z1; z++) out.push([x, z]);
  return out;
};

// the pagoda, on its two-layer stone platform
function pagoda(P, roof, wall, gold){
  for(let x = 12; x <= 18; x++) for(let z = 12; z <= 18; z++){
    P.put(x, 1, z, COL.stone);
    P.put(x, 2, z, COL.stoneTop);
  }
  P.put(15, 1, 11, COL.stoneTop);
  for(let y = 3; y <= 4; y++) for(let x = 13; x <= 17; x++) for(let z = 13; z <= 17; z++) P.put(x, y, z, wall);
  for(let x = 12; x <= 18; x++) for(let z = 12; z <= 18; z++) P.put(x, 5, z, roof);
  for(let y = 6; y <= 7; y++) for(let x = 14; x <= 17; x++) for(let z = 14; z <= 17; z++) P.put(x, y, z, wall);
  for(let x = 13; x <= 18; x++) for(let z = 13; z <= 18; z++) P.put(x, 8, z, roof);
  for(let y = 9; y <= 10; y++) for(let x = 14; x <= 16; x++) for(let z = 14; z <= 16; z++) P.put(x, y, z, wall);
  for(let x = 13; x <= 17; x++) for(let z = 13; z <= 17; z++) P.put(x, 11, z, roof);
  P.put(15, 12, 15, gold); P.put(15, 13, 15, gold);
  P.rep(13, 3, 15, COL.door); P.rep(13, 4, 15, COL.door);
}

function leafyTree(P, x, z, c1, c2){
  P.put(x, 1, z, COL.trunk); P.put(x, 2, z, COL.trunk); P.put(x, 3, z, COL.trunk);
  for(let dx = -1; dx <= 1; dx++) for(let dz = -1; dz <= 1; dz++){
    P.put(x + dx, 4, z + dz, c1);
    if(!(dx && dz)) P.put(x + dx, 5, z + dz, c2);
  }
  P.put(x, 6, z, c1);
}
/* ----------------------------------------------------------------- garden */
const GARDEN_LAMPS = [[12.55, 3.6, 15.0, 1.30], [12.9, 1.4, 11.2, 0.70], [10.4, 0.9, 5.0, 0.55], [9.4, 0.9, 8.0, 0.55]];

function buildGarden(P){
  const path = [[9,1],[9,2],[10,3],[10,4],[10,5],[9,6],[9,7],[9,8],[10,9],[11,10],[12,11],[13,11],[14,11],[15,11],[16,11]];
  plot(P, { water: box(3, 4, 7, 8), path, g1: COL.grassA, g2: COL.grassB });
  [[4,5],[6,6],[6,4],[4,8],[7,7]].forEach(p => P.put(p[0], 1, p[1], COL.lily));
  [[4,5],[6,6]].forEach(p => P.put(p[0], 2, p[1], COL.flower));
  leafyTree(P, 2, 13, COL.leaf, COL.leaf2);
  leafyTree(P, 6, 17, COL.leaf, COL.leaf2);
  leafyTree(P, 19, 5, COL.leaf, COL.leaf2);
  leafyTree(P, 17, 2, COL.leaf, COL.leaf2);
  pagoda(P, COL.roof, COL.wall, COL.gold);
}

const S = makeScene("Garden", GARDEN_LAMPS, buildGarden);

/* ------------------------------------------------------------------ camera */
let yaw = 3.86, pitch = 0.52;
let zoom = 1, zoomTarget = 1;
const ZOOM_MIN = 0.55, ZOOM_MAX = 2.6;
let dragging = false, lx = 0, ly = 0, vel = 0, lastTouch = 0;
const cam = { ca: 1, sa: 0, cp: 1, sp: 0, ssp: 0, csp: 0, s: 1, ox: 0, oy: 0 };

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

/* -------------------------------------------------------------- time / mood */
let hour = 16.6;
let cycleOn = true;

// keyframes: sky top/bottom, full-screen tint (multiply), night amount
const MOOD = [
  { h: 0.0,  top: [7, 11, 24],    bot: [17, 27, 45],    tint: [28, 40, 84],   ta: 0.76, night: 1.00 },
  { h: 4.6,  top: [24, 30, 54],   bot: [64, 52, 80],    tint: [64, 56, 104],  ta: 0.62, night: 0.85 },
  { h: 6.4,  top: [152, 172, 206],bot: [244, 208, 182], tint: [255, 190, 150],ta: 0.20, night: 0.18 },
  { h: 9.0,  top: [178, 210, 232],bot: [238, 244, 246], tint: [255, 250, 240],ta: 0.05, night: 0.00 },
  { h: 13.0, top: [188, 220, 240],bot: [240, 246, 244], tint: [255, 255, 255],ta: 0.00, night: 0.00 },
  { h: 16.8, top: [200, 214, 236],bot: [251, 236, 212], tint: [255, 226, 186],ta: 0.12, night: 0.00 },
  { h: 18.6, top: [112, 100, 138],bot: [240, 164, 122], tint: [255, 152, 104],ta: 0.34, night: 0.24 },
  { h: 20.4, top: [22, 32, 54],   bot: [34, 46, 70],    tint: [36, 50, 100],  ta: 0.72, night: 0.90 },
  { h: 24.0, top: [7, 11, 24],    bot: [17, 27, 45],    tint: [28, 40, 84],   ta: 0.76, night: 1.00 }
];

function moodAt(h){
  h = ((h % 24) + 24) % 24;
  let i = 0;
  while(i < MOOD.length - 2 && h > MOOD[i + 1].h) i++;
  const a = MOOD[i], b = MOOD[i + 1];
  const t = (h - a.h) / Math.max(1e-6, b.h - a.h);
  const mix = (p, q) => [lerp(p[0], q[0], t), lerp(p[1], q[1], t), lerp(p[2], q[2], t)];
  return {
    top: mix(a.top, b.top), bot: mix(a.bot, b.bot), tint: mix(a.tint, b.tint),
    ta: lerp(a.ta, b.ta, t), night: lerp(a.night, b.night, t)
  };
}
const rgb = c => "rgb(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + ")";

/* --------------------------------------------------------------- particles */
let rain = [], snow = [], stars = [], flies = [];
let rainAmt = 0, snowAmt = 0, rainTarget = 0, snowTarget = 0;

function seedParticles(){
  const area = Math.max(1, innerWidth * innerHeight);
  const nRain = clamp(Math.round(area / 3400), 160, 520);
  const nSnow = clamp(Math.round(area / 5200), 120, 420);
  const nFlies = clamp(Math.round(area / 110000), 6, 16);

  rain = [];
  for(let i = 0; i < nRain; i++){
    rain.push({ x: Math.random(), y: Math.random(), v: 0.90 + Math.random() * 0.60,
                l: 0.020 + Math.random() * 0.030, k: 0.16 + Math.random() * 0.10 });
  }
  snow = [];
  for(let i = 0; i < nSnow; i++){
    snow.push({ x: Math.random(), y: Math.random(), v: 0.035 + Math.random() * 0.05,
                r: 1 + Math.random() * 2.2, amp: 0.02 + Math.random() * 0.05,
                ph: Math.random() * 6.283 });
  }
  stars = [];
  for(let i = 0; i < 150; i++){
    stars.push({ x: Math.random(), y: Math.random() * 0.58, r: 1 + Math.random() * 1.6,
                 a: 0.35 + Math.random() * 0.65, ph: Math.random() * 6.283 });
  }
  flies = [];
  for(let i = 0; i < nFlies; i++){
    flies.push({ x: 0.32 + Math.random() * 0.36, y: 0.52 + Math.random() * 0.30,
                 ph: Math.random() * 6.283, sp: 0.3 + Math.random() * 0.7 });
  }
}

/* -------------------------------------------------------------- projection */
function project(wx, wy, wz){
  const X = wx - S.cx, Y = wy - S.cy, Z = wz - S.cz;
  return [
    (X * cam.ca - Z * cam.sa) * cam.s + cam.ox,
    (X * cam.ssp - Y * cam.cp + Z * cam.csp) * cam.s + cam.oy
  ];
}

// soft light blobs are pre-rendered once per colour and blitted, which is far
// cheaper than building a radial gradient every frame (the Firefox case)
const glowSprites = new Map();
function glowSprite(col){
  const key = col.join(",");
  let c = glowSprites.get(key);
  if(c) return c;
  const SIZE = 96;
  c = document.createElement("canvas");
  c.width = c.height = SIZE;
  const g = c.getContext("2d");
  const rg = g.createRadialGradient(SIZE / 2, SIZE / 2, 0, SIZE / 2, SIZE / 2, SIZE / 2);
  rg.addColorStop(0, "rgba(" + key + ",1)");
  rg.addColorStop(0.40, "rgba(" + key + ",0.32)");
  rg.addColorStop(1, "rgba(" + key + ",0)");
  g.fillStyle = rg;
  g.fillRect(0, 0, SIZE, SIZE);
  glowSprites.set(key, c);
  return c;
}
function glow(g, x, y, r, col, a){
  if(a <= 0.004 || r <= 0.5) return;
  g.globalAlpha = Math.min(1, a);
  g.drawImage(glowSprite(col), x - r, y - r, r * 2, r * 2);
  g.globalAlpha = 1;
}

/* ------------------------------------------------------------------ render */
// the expensive static half of a frame: sky, voxels, grades, stars, sun/moon, lanterns
function drawSceneLayer(now){
  const ctx = lctx;
  const m = moodAt(hour);

  const ca = Math.cos(yaw), sa = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const scp = sa * cp, ccp = ca * cp;
  const ssp = sa * sp, csp = ca * sp;
  const s = Math.min(W, H) / S.fit * zoom, ox = W / 2, oy = H / 2;
  const pts = S.pts;
  cam.ca = ca; cam.sa = sa; cam.cp = cp; cam.sp = sp;
  cam.ssp = ssp; cam.csp = csp; cam.s = s; cam.ox = ox; cam.oy = oy;

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";

  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, rgb(m.top));
  sky.addColorStop(1, rgb(m.bot));
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // project the 8 corners of every cube
  for(let i = 0; i < S.n; i++){
    const j = i * 6, b = i * 12;
    const X0 = S.pos[j], X1 = S.pos[j + 1], Y0 = S.pos[j + 2], Y1 = S.pos[j + 3],
          Z0 = S.pos[j + 4], Z1 = S.pos[j + 5];
    const xc0 = X0 * ca, xc1 = X1 * ca, zs0 = Z0 * sa, zs1 = Z1 * sa;
    pts[b]     = xc0 - zs0; pts[b + 1] = xc1 - zs0;
    pts[b + 2] = xc1 - zs1; pts[b + 3] = xc0 - zs1;
    const xsp0 = X0 * ssp, xsp1 = X1 * ssp, ycp0 = -Y0 * cp, ycp1 = -Y1 * cp,
          zsp0 = Z0 * csp, zsp1 = Z1 * csp;
    pts[b + 4]  = xsp0 + ycp0 + zsp0; pts[b + 5]  = xsp1 + ycp0 + zsp0;
    pts[b + 6]  = xsp1 + ycp0 + zsp1; pts[b + 7]  = xsp0 + ycp0 + zsp1;
    pts[b + 8]  = xsp0 + ycp1 + zsp0; pts[b + 9]  = xsp1 + ycp1 + zsp0;
    pts[b + 10] = xsp1 + ycp1 + zsp1; pts[b + 11] = xsp0 + ycp1 + zsp1;
  }

  // collect uncovered, camera-facing faces with a painter depth key
  let fc = 0;
  for(let i = 0; i < S.n; i++){
    const mask = S.occ[i], cb = i * 15;
    for(let f = 0; f < 5; f++){
      if(mask & (1 << f)) continue;
      if(NX[f] * scp + NY[f] * sp + NZ[f] * ccp <= 0) continue;
      S.faceDepth[fc] = S.FC[cb + f * 3] * scp + S.FC[cb + f * 3 + 1] * sp + S.FC[cb + f * 3 + 2] * ccp;
      S.faceIdx[fc] = i * 5 + f;
      S.faceOrder[fc] = fc;
      fc++;
    }
  }
  S.faceOrder.length = fc;
  S.faceOrder.sort(S.byFaceDepth);

  for(let k = 0; k < fc; k++){
    const q = S.faceIdx[S.faceOrder[k]], i = (q / 5) | 0, f = q % 5;
    const b = i * 12;
    const x0 = pts[b] * s + ox, x1 = pts[b + 1] * s + ox,
          x2 = pts[b + 2] * s + ox, x3 = pts[b + 3] * s + ox;
    const y0 = pts[b + 4] * s + oy, y1 = pts[b + 5] * s + oy,
          y2 = pts[b + 6] * s + oy, y3 = pts[b + 7] * s + oy,
          y4 = pts[b + 8] * s + oy, y5 = pts[b + 9] * s + oy,
          y6 = pts[b + 10] * s + oy, y7 = pts[b + 11] * s + oy;
    ctx.fillStyle = S.cols[i][f];
    ctx.beginPath();
    switch(f){
      case 0: ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.lineTo(x2, y6); ctx.lineTo(x1, y5); break;
      case 1: ctx.moveTo(x0, y0); ctx.lineTo(x3, y3); ctx.lineTo(x3, y7); ctx.lineTo(x0, y4); break;
      case 2: ctx.moveTo(x2, y2); ctx.lineTo(x3, y3); ctx.lineTo(x3, y7); ctx.lineTo(x2, y6); break;
      case 3: ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x1, y5); ctx.lineTo(x0, y4); break;
      default: ctx.moveTo(x0, y4); ctx.lineTo(x1, y5); ctx.lineTo(x2, y6); ctx.lineTo(x3, y7);
    }
    ctx.closePath();
    ctx.fill();
  }

  // time-of-day grade
  if(m.ta > 0.002){
    ctx.globalCompositeOperation = "multiply";
    ctx.fillStyle = "rgba(" + (m.tint[0] | 0) + "," + (m.tint[1] | 0) + "," + (m.tint[2] | 0) + "," + m.ta.toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "source-over";
  }

  // overcast: a real city's cloud cover flattens the light a little
  if(cloudAmt > 0.01){
    ctx.globalCompositeOperation = "multiply";
    ctx.fillStyle = "rgba(150,159,172," + (0.20 * cloudAmt).toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "source-over";
  }

  // weather grade: rain darkens and cools, snow lifts and softens
  if(rainAmt > 0.01){
    ctx.globalCompositeOperation = "multiply";
    ctx.fillStyle = "rgba(96,116,138," + (0.22 * rainAmt).toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "source-over";
  }
  if(snowAmt > 0.01){
    ctx.globalCompositeOperation = "lighter";
    ctx.fillStyle = "rgba(196,214,230," + (0.045 * snowAmt).toFixed(3) + ")";
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "source-over";
  }

  // stars (night, thinning out in rain and snow)
  const starA = m.night * (1 - rainAmt * 0.85) * (1 - snowAmt * 0.55);
  if(starA > 0.02){
    ctx.globalCompositeOperation = "lighter";
    for(let i = 0; i < stars.length; i++){
      const st = stars[i];
      const tw = 0.55 + 0.45 * Math.sin(now * 0.0011 + st.ph);
      ctx.globalAlpha = starA * st.a * tw;
      ctx.fillStyle = "#e8f0ff";
      ctx.fillRect(st.x * W, st.y * H, st.r * DPR, st.r * DPR);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  // sun or moon halo
  const elev = Math.sin(((hour - 6) / 24) * Math.PI * 2);   // 6h 0, 12h 1, 18h 0
  const glowR = Math.min(W, H) * 0.42;
  ctx.globalCompositeOperation = "lighter";
  if(elev > 0){
    const sx = (0.06 + ((hour - 6) / 12) * 0.88) * W;
    const sy = H * (0.66 - elev * 0.46);
    const warm = clamp(1 - Math.abs(hour - 12) / 7, 0, 1);
    glow(ctx, sx, sy, glowR * 0.8, [255, 232, 178], 0.09 + 0.13 * warm);
    glow(ctx, sx, sy, Math.min(W, H) * 0.045, [255, 250, 232], 0.40);
  } else {
    const nightFrac = ((hour - 18 + 24) % 24) / 12;          // 0 at 18h, 1 at 6h
    const me = Math.sin(clamp(nightFrac, 0, 1) * Math.PI);
    if(me > 0.02){
      const sx = (0.06 + clamp(nightFrac, 0, 1) * 0.88) * W;
      const sy = H * (0.66 - me * 0.46);
      glow(ctx, sx, sy, glowR * 0.7, [180, 200, 235], 0.10 + 0.14 * me);
      glow(ctx, sx, sy, Math.min(W, H) * 0.030, [235, 242, 255], 0.42 * me);
    }
  }

  // lanterns
  const nightA = m.night;
  if(nightA > 0.10){
    for(let i = 0; i < S.lamps.length; i++){
      const L2 = S.lamps[i];
      const p = project(L2[0], L2[1], L2[2]);
      glow(ctx, p[0], p[1], s * 2.3 * L2[3], [255, 190, 112], 0.20 * nightA * L2[3]);
    }
  }
  ctx.globalCompositeOperation = "source-over";
}

function render(now, dt, active){
  const m = moodAt(hour);
  const s = Math.min(W, H) / S.fit * zoom;

  // rebuild the voxel layer only when something it depends on moved
  const moved = !cacheState || W !== cacheState.w || H !== cacheState.h ||
    Math.abs(yaw - cacheState.yaw) > 0.0006 || Math.abs(pitch - cacheState.pitch) > 0.0006 ||
    Math.abs(zoom - cacheState.zoom) > 0.002 || Math.abs(hour - cacheState.hour) > 0.02 ||
    Math.abs(rainAmt - cacheState.rain) > 0.02 || Math.abs(snowAmt - cacheState.snow) > 0.02 ||
    Math.abs(cloudAmt - cacheState.cloud) > 0.02;
  if(moved){
    drawSceneLayer(now);
    cacheState = { yaw, pitch, zoom, hour, rain: rainAmt, snow: snowAmt, cloud: cloudAmt, w: W, h: H };
  }

  // nothing on screen is moving (no weather, no fireflies, no zoom easing): keep the
  // last frame instead of blitting two full-screen images sixty times a second
  if(!moved && !active) return;

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
  ctx.drawImage(layer, 0, 0);

  // fireflies drift, so they stay out of the cached layer
  const nightA = m.night;
  if(nightA > 0.10){
    ctx.globalCompositeOperation = "lighter";
    for(let i = 0; i < flies.length; i++){
      const f = flies[i];
      const fx = (f.x + Math.sin(now * 0.00021 * f.sp + f.ph) * 0.045) * W;
      const fy = (f.y + Math.cos(now * 0.00017 * f.sp + f.ph * 1.7) * 0.03) * H;
      const a = nightA * (0.16 + 0.20 * Math.sin(now * 0.0013 * f.sp + f.ph));
      glow(ctx, fx, fy, s * 0.34, [255, 226, 150], a);
    }
    ctx.globalCompositeOperation = "source-over";
  }

  // weather particles
  if(rainAmt > 0.01){
    const bright = (m.top[0] + m.top[1] + m.top[2]) / 3;
    const col = bright > 140 ? "122,142,168" : "196,212,232";
    ctx.strokeStyle = "rgba(" + col + "," + (0.40 * rainAmt).toFixed(3) + ")";
    ctx.lineWidth = Math.max(1, DPR * 0.8);
    ctx.beginPath();
    for(let i = 0; i < rain.length; i++){
      const r = rain[i];
      const x = r.x * W, y = r.y * H, len = r.l * H, k = r.k * 0.1 * W;
      ctx.moveTo(x, y);
      ctx.lineTo(x - k, y + len);
    }
    ctx.stroke();
  }
  if(snowAmt > 0.01){
    ctx.fillStyle = "rgba(255,255,255," + (0.72 * snowAmt).toFixed(3) + ")";
    ctx.beginPath();
    for(let i = 0; i < snow.length; i++){
      const f = snow[i];
      const x = f.x * W, y = f.y * H, r = f.r * DPR;
      ctx.moveTo(x + r, y);
      ctx.arc(x, y, r, 0, 6.2832);
    }
    ctx.fill();
  }

  // vignette
  if(vignetteCv) ctx.drawImage(vignetteCv, 0, 0);
}

/* ------------------------------------------------------------------ update */
function updateWeather(dt){
  rainAmt += (rainTarget - rainAmt) * Math.min(1, dt * 1.4);
  snowAmt += (snowTarget - snowAmt) * Math.min(1, dt * 1.4);
  if(rainAmt < 0.002) rainAmt = rainTarget === 0 ? 0 : rainAmt;
  if(snowAmt < 0.002) snowAmt = snowTarget === 0 ? 0 : snowAmt;

  for(let i = 0; i < rain.length; i++){
    const r = rain[i];
    r.y += r.v * dt * 1.35;
    r.x -= r.k * dt * 0.55;
    if(r.y > 1.05){ r.y = -0.05; r.x = Math.random(); }
    if(r.x < -0.05) r.x = 1.05;
  }
  for(let i = 0; i < snow.length; i++){
    const f = snow[i];
    f.y += f.v * dt;
    f.x += Math.sin(f.ph + performance.now() * 0.0004) * f.amp * dt;
    if(f.y > 1.05){ f.y = -0.05; f.x = Math.random(); }
    if(f.x < -0.05) f.x = 1.05; else if(f.x > 1.05) f.x = -0.05;
  }
}

/* ------------------------------------------------------------------- audio */
// A small ambient engine: washed pad, sub bass, sparse "music box" plucks through a
// real convolution reverb, plus air and a rain bed. Everything runs under a compressor
// and a soft high shelf, and the default level is deliberately low so it can play all day.
let ac = null, master = null, mix = null, send = null;
let rainGain = null, airGain = null, padGain = null, bassOsc = null;
let padVoices = [], soundOn = false, vol = 0.18;
let chordIx = -1, nextChordAt = 0, nextPluckAt = 0, schedTimer = 0;

const PROG = [
  { bass: 73.42, pad: [146.83, 185.00, 220.00, 277.18, 329.63] },   // Dmaj9
  { bass: 61.74, pad: [146.83, 185.00, 246.94, 293.66, 329.63] },   // Bm7
  { bass: 49.00, pad: [146.83, 196.00, 246.94, 293.66, 392.00] },   // Gmaj7
  { bass: 55.00, pad: [164.81, 220.00, 246.94, 329.63, 392.00] }    // Aadd9
];
const SCALE = [293.66, 329.63, 369.99, 440.00, 493.88, 587.33, 659.25, 739.99];

function makeImpulse(seconds, decay){
  const len = Math.max(1, Math.floor(ac.sampleRate * seconds));
  const buf = ac.createBuffer(2, len, ac.sampleRate);
  for(let ch = 0; ch < 2; ch++){
    const d = buf.getChannelData(ch);
    let lp = 0;
    for(let i = 0; i < len; i++){
      const t = i / len;
      const n = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
      lp = lp * 0.72 + n * 0.28;            // darkened tail
      d[i] = lp;
    }
  }
  return buf;
}

function makeNoise(seconds){
  const len = Math.max(1, Math.floor(ac.sampleRate * seconds));
  const buf = ac.createBuffer(1, len, ac.sampleRate);
  const d = buf.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0;
  for(let i = 0; i < len; i++){
    const w = Math.random() * 2 - 1;
    b0 = 0.99765 * b0 + w * 0.0990460;
    b1 = 0.96300 * b1 + w * 0.2965164;
    b2 = 0.57000 * b2 + w * 1.0526913;
    d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.19;
  }
  return buf;
}

function audioInit(){
  if(ac) return true;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return false;
  ac = new AC();

  master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);

  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -20; comp.knee.value = 18; comp.ratio.value = 3;
  comp.attack.value = 0.02; comp.release.value = 0.4;
  comp.connect(master);

  const shelf = ac.createBiquadFilter();
  shelf.type = "highshelf"; shelf.frequency.value = 5200; shelf.gain.value = -2.5;
  shelf.connect(comp);

  mix = ac.createGain();
  mix.gain.value = 1;
  mix.connect(shelf);

  const conv = ac.createConvolver();
  conv.buffer = makeImpulse(3.0, 2.6);
  const revGain = ac.createGain();
  revGain.gain.value = 0.36;
  conv.connect(revGain); revGain.connect(mix);
  send = ac.createGain();
  send.gain.value = 1;
  send.connect(conv);

  // pad: five voices, triangle plus a slightly detuned sine
  const padFilter = ac.createBiquadFilter();
  padFilter.type = "lowpass"; padFilter.frequency.value = 1500; padFilter.Q.value = 0.3;
  padGain = ac.createGain();
  padGain.gain.value = 0.17;
  padFilter.connect(padGain);
  padGain.connect(mix);
  const padSend = ac.createGain(); padSend.gain.value = 0.5;
  padGain.connect(padSend); padSend.connect(send);

  padVoices = [];
  for(let i = 0; i < 5; i++){
    const a = ac.createOscillator(); a.type = "triangle";
    const b = ac.createOscillator(); b.type = "sine";
    a.frequency.value = b.frequency.value = PROG[0].pad[i];
    const g = ac.createGain();
    g.gain.value = 0.05;
    a.connect(g); b.connect(g); g.connect(padFilter);
    a.start(); b.start();
    padVoices.push({ a, b, g });
  }

  // sub bass
  bassOsc = ac.createOscillator();
  bassOsc.type = "sine";
  bassOsc.frequency.value = PROG[0].bass;
  const bassGain = ac.createGain();
  bassGain.gain.value = 0.055;
  bassOsc.connect(bassGain); bassGain.connect(mix); bassGain.connect(send);
  bassOsc.start();

  // air
  const airSrc = ac.createBufferSource(); airSrc.buffer = makeNoise(4); airSrc.loop = true;
  const airF = ac.createBiquadFilter();
  airF.type = "bandpass"; airF.frequency.value = 620; airF.Q.value = 0.6;
  airGain = ac.createGain();
  airGain.gain.value = 0.04;
  airSrc.connect(airF); airF.connect(airGain); airGain.connect(mix);
  airSrc.start();
  const airLfo = ac.createOscillator(); airLfo.frequency.value = 0.05;
  const airLfoG = ac.createGain(); airLfoG.gain.value = 220;
  airLfo.connect(airLfoG); airLfoG.connect(airF.frequency); airLfo.start();

  // rain bed
  const rs = ac.createBufferSource(); rs.buffer = makeNoise(4); rs.loop = true;
  const rh = ac.createBiquadFilter(); rh.type = "highpass"; rh.frequency.value = 1200;
  const rl = ac.createBiquadFilter(); rl.type = "lowpass"; rl.frequency.value = 5200;
  rainGain = ac.createGain();
  rainGain.gain.value = 0;
  rs.connect(rh); rh.connect(rl); rl.connect(rainGain); rainGain.connect(mix);
  const rainSend = ac.createGain(); rainSend.gain.value = 0.25;
  rainGain.connect(rainSend); rainSend.connect(send);
  rs.start();

  return true;
}

function pluck(freq, when){
  if(!ac) return;
  const g = ac.createGain();
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(0.10, when + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, when + 3.6);

  const o = ac.createOscillator(); o.type = "sine"; o.frequency.value = freq;
  const o2 = ac.createOscillator(); o2.type = "sine"; o2.frequency.value = freq * 2.005;
  const g2 = ac.createGain();
  g2.gain.setValueAtTime(0.0001, when);
  g2.gain.exponentialRampToValueAtTime(0.02, when + 0.012);
  g2.gain.exponentialRampToValueAtTime(0.0001, when + 1.2);

  o.connect(g); o2.connect(g2);
  g.connect(mix); g2.connect(mix);
  g.connect(send); g2.connect(send);
  o.start(when); o2.start(when);
  o.stop(when + 3.8); o2.stop(when + 1.4);
}

function applyChord(when){
  const ch = PROG[chordIx];
  for(let i = 0; i < padVoices.length; i++){
    const v = padVoices[i];
    const f = ch.pad[i];
    v.a.frequency.setTargetAtTime(f, when, 2.6);
    v.b.frequency.setTargetAtTime(f * 1.0035, when, 2.6);
  }
  bassOsc.frequency.setTargetAtTime(ch.bass, when, 2.4);
}

function scheduler(){
  if(!ac || !soundOn) return;
  const now = ac.currentTime;
  const horizon = now + 2.0;
  if(nextChordAt < horizon){
    const when = Math.max(now, nextChordAt);
    chordIx = (chordIx + 1) % PROG.length;
    applyChord(when);
    nextChordAt = when + 11 + Math.random() * 3;
  }
  if(nextPluckAt < horizon){
    const when = Math.max(now, nextPluckAt);
    pluck(SCALE[Math.floor(Math.random() * SCALE.length)], when);
    nextPluckAt = when + 2.8 + Math.random() * 5.5;
  }
}

function startSound(){
  if(!audioInit()) return;
  ac.resume();
  soundOn = true;
  chordIx = Math.floor(Math.random() * PROG.length);
  const t = ac.currentTime;
  applyChord(t);
  nextChordAt = t + 11;
  nextPluckAt = t + 4 + Math.random() * 4;
  clearInterval(schedTimer);
  schedTimer = setInterval(scheduler, 250);
  master.gain.setTargetAtTime(vol * 0.5, t, 0.9);
}

function stopSound(){
  soundOn = false;
  if(!ac) return;
  clearInterval(schedTimer);
  master.gain.setTargetAtTime(0, ac.currentTime, 0.6);
}

function updateAudio(){
  if(!ac) return;
  const t = ac.currentTime;
  rainGain.gain.setTargetAtTime(rainAmt * 0.08, t, 0.8);
  airGain.gain.setTargetAtTime(0.035 + snowAmt * 0.025 + rainAmt * 0.015, t, 1.0);
}

/* ---------------------------------------------------------------------- UI */
const ui = document.getElementById("ui");
const hourInput = document.getElementById("hour");
const clockEl = document.getElementById("clock");
const cycleBtn = document.getElementById("cycle");
const sndBtn = document.getElementById("snd");
const volInput = document.getElementById("vol");
const hint = document.getElementById("hint");
const zinBtn = document.getElementById("zin");
const zoutBtn = document.getElementById("zout");
const placeBtn = document.getElementById("place");
const placesEl = document.getElementById("places");
const placeBtns = Array.from(document.querySelectorAll("[data-place]"));
const wxBtns = Array.from(document.querySelectorAll("[data-wx]"));

/* ------------------------------------------------------- back to the city */
// The city page (the site front page) sends people here with ?city=<id>; a browser
// coming straight from it sends a referrer instead. Either way, leave a way back.
// When the garden is opened on its own the pill never appears.
const CITY_NAMES = {
  vancouver: "Vancouver", toronto: "Toronto", hawaii: "Hawai'i",
  hongkong: "Hong Kong", amsterdam: "Amsterdam", sydney: "Sydney"
};

function cityFromQuery(){
  const search = (typeof location !== "undefined" && location.search) || "";
  const m = /[?&]city=([^&#]*)/.exec(search);
  if(!m) return null;                                  // no ?city= at all
  try { return decodeURIComponent(m[1]); } catch(e){ return m[1]; }
}

(function initBackPill(){
  const back = document.getElementById("backCity");
  if(!back) return;
  const key = cityFromQuery();
  const referrer = (typeof document !== "undefined" && document.referrer) || "";
  if(key === null && !/\/pagoda\/?(index\.html)?([?#]|$)/i.test(referrer)) return;
  back.textContent = "\u2190 back to " + (CITY_NAMES[key] || "the city");
  back.href = "../" + (key ? "?city=" + encodeURIComponent(key) : "");
  back.hidden = false;
})();

function updateClock(){
  const h = ((hour % 24) + 24) % 24;
  const hh = Math.floor(h), mm = Math.floor((h - hh) * 60);
  clockEl.textContent = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
}
updateClock();

let hideTimer = 0;
function showUI(){
  ui.classList.add("show");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => { if(!ui.matches(":hover")) ui.classList.remove("show"); }, 4800);
}
addEventListener("pointermove", showUI, { passive: true });
addEventListener("pointerdown", showUI, { passive: true });
ui.addEventListener("mouseenter", () => clearTimeout(hideTimer));
ui.addEventListener("mouseleave", () => { hideTimer = setTimeout(() => ui.classList.remove("show"), 1600); });
setTimeout(showUI, 700);

hourInput.addEventListener("input", () => {
  hour = parseFloat(hourInput.value);
  cycleOn = false;
  cycleBtn.setAttribute("aria-pressed", "false");
  updateClock();
  savePrefs();
});

cycleBtn.addEventListener("click", () => {
  cycleOn = !cycleOn;
  cycleBtn.setAttribute("aria-pressed", String(cycleOn));
  savePrefs();
});

function setWeather(which){
  currentWx = which;
  rainTarget = which === "rain" ? 1 : 0;
  snowTarget = which === "snow" ? 1 : 0;
  for(const b of wxBtns) b.setAttribute("aria-pressed", String(b.dataset.wx === which));
}
// A hand-picked sky means you have left location mode: a location is always its real
// weather, so overriding one drops the city instead of quietly disagreeing with it.
function manualWeather(which){
  if(placeIx !== null) selectPlace(null);
  wxAuto = false;
  cloudAmt = 0;
  setWeather(which);
  updateInfo();
  savePrefs();
}
for(const b of wxBtns) b.addEventListener("click", () => manualWeather(b.dataset.wx));

/* ------------------------------------------------------------------ places */
// Real city clocks (Intl handles DST) plus live conditions from Open-Meteo, which
// needs no key and allows browser requests. Offline, the clock still works and the
// weather simply stays as it was. A city drives the clock and the weather only:
// the garden itself is always this one garden.
const PLACES = [
  { name: "Vancouver", lat: 49.2827, lon: -123.1207, tz: "America/Vancouver" },
  { name: "Toronto",   lat: 43.6532, lon: -79.3832,  tz: "America/Toronto" },
  { name: "Hawai'i",   lat: 21.3069, lon: -157.8583, tz: "Pacific/Honolulu" },
  { name: "Hong Kong", lat: 22.3193, lon: 114.1694,  tz: "Asia/Hong_Kong" },
  { name: "Amsterdam", lat: 52.3676, lon: 4.9041,    tz: "Europe/Amsterdam" }
];
let placeIx = null, placeTemp = null, cloudAmt = 0, wxAuto = true;
let placeCode = null, fetchState = "idle", lastFetchAt = 0;

/** The three manual states, expressed as WMO codes so both paths read the same. */
function wxToCode(kind){ return kind === "rain" ? 61 : kind === "snow" ? 71 : 0; }

function condLabel(code){
  if(code === 0) return "Clear sky";
  if(code <= 2) return "Partly cloudy";
  if(code === 3) return "Overcast";
  if(code === 45 || code === 48) return "Fog";
  if(code >= 51 && code <= 57) return "Drizzle";
  if(code >= 61 && code <= 67) return "Rain";
  if(code >= 71 && code <= 77) return "Snow";
  if(code >= 80 && code <= 82) return "Showers";
  if(code === 85 || code === 86) return "Snow showers";
  if(code >= 95) return "Thunderstorm";
  return "—";
}

function localHour(tz){
  try{
    const parts = new Intl.DateTimeFormat("en-GB", {
      timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false
    }).formatToParts(new Date());
    const h = Number(parts.find(p => p.type === "hour").value) % 24;
    const m = Number(parts.find(p => p.type === "minute").value);
    return h + m / 60;
  }catch(e){ return hour; }
}

function weatherKind(code){
  if([71, 73, 75, 77, 85, 86].includes(code)) return "snow";
  if((code >= 51 && code <= 67) || (code >= 80 && code <= 82) || code >= 95) return "rain";
  return "clear";
}

function updatePlaceLabel(){
  if(placeIx === null){ placeBtn.textContent = "location"; return; }
  const L = PLACES[placeIx];
  placeBtn.textContent = L.name + (placeTemp === null ? "" : " " + placeTemp + "°");
  for(const b of placeBtns) b.setAttribute("aria-current", String(b.dataset.place === String(placeIx)));
}

async function refreshPlaceWeather(){
  if(placeIx === null) return;
  const L = PLACES[placeIx];
  fetchState = "loading";
  updateInfo();
  try{
    const url = "https://api.open-meteo.com/v1/forecast?latitude=" + L.lat + "&longitude=" + L.lon +
                "&current=weather_code,temperature_2m,cloud_cover&timezone=auto";
    const r = await fetch(url, { cache: "no-store" });
    if(!r.ok) throw new Error("http " + r.status);
    const j = await r.json();
    const cur = (j && j.current) || {};
    wxAuto = true;
    placeCode = Number.isFinite(cur.weather_code) ? Number(cur.weather_code) : null;
    setWeather(weatherKind(placeCode));
    cloudAmt = Number.isFinite(cur.cloud_cover) ? clamp(cur.cloud_cover / 100, 0, 1) : 0;
    placeTemp = Number.isFinite(cur.temperature_2m) ? Math.round(cur.temperature_2m) : null;
    fetchState = "ok";
    lastFetchAt = Date.now();
  }catch(e){
    fetchState = "error";
  }
  updatePlaceLabel();
  updateInfo();
}

function selectPlace(ix){
  placeIx = Number.isInteger(ix) ? ix : null;
  placeTemp = null;
  if(placeIx === null){
    wxAuto = true;
    cloudAmt = 0;
    placeCode = null;
    fetchState = "idle";
    updatePlaceLabel();
  }else{
    wxAuto = true;
    hour = localHour(PLACES[placeIx].tz);
    cycleOn = false;
    cycleBtn.setAttribute("aria-pressed", "false");
    hourInput.value = hour.toFixed(2);
    updateClock();
    updatePlaceLabel();
    refreshPlaceWeather();
  }
  updateInfo();
  savePrefs();
}

function openPlaces(open){
  placesEl.hidden = !open;
  placeBtn.setAttribute("aria-expanded", String(open));
  if(open){
    showUI();
    // sit just above the bar and centred on the button, whatever the bar wrapped to
    const bar = ui.getBoundingClientRect();
    const pb = placeBtn.getBoundingClientRect();
    placesEl.style.bottom = Math.max(10, Math.round(innerHeight - bar.top + 8)) + "px";
    placesEl.style.left = Math.round(clamp(pb.left + pb.width / 2, 90, innerWidth - 90)) + "px";
  }
}
placeBtn.addEventListener("click", e => {
  e.stopPropagation();
  openPlaces(placesEl.hidden);
});
for(const b of placeBtns) b.addEventListener("click", () => {
  selectPlace(b.dataset.place === "local" ? null : Number(b.dataset.place));
  openPlaces(false);
});
addEventListener("pointerdown", e => {
  if(!placesEl.hidden && !placesEl.contains(e.target) && e.target !== placeBtn) openPlaces(false);
}, { passive: true });

/* ------------------------------------------------------------- corner card */
const info = document.getElementById("info");
const infoHead = document.getElementById("infoHead");
const infoPlace = document.getElementById("infoPlace");
const infoClock = document.getElementById("infoClock");
const infoRefresh = document.getElementById("infoRefresh");
const infoCond = document.getElementById("infoCond");
const infoTemp = document.getElementById("infoTemp");
const infoMeta = document.getElementById("infoMeta");
const infoScene = document.getElementById("infoScene");

const pad2 = n => String(n).padStart(2, "0");
function fmtHour(h){
  const x = ((h % 24) + 24) % 24;
  const hh = Math.floor(x), mm = Math.min(59, Math.round((x - hh) * 60));
  return pad2(hh) + ":" + pad2(mm);
}
function ownHour(){
  const d = new Date();
  return d.getHours() + d.getMinutes() / 60;
}

function updateInfo(){
  const place = placeIx === null ? null : PLACES[placeIx];
  const realH = place ? localHour(place.tz) : ownHour();

  infoPlace.textContent = place ? place.name : "Own time";
  infoClock.textContent = fmtHour(realH);

  if(place){
    infoCond.textContent = !wxAuto ? condLabel(wxToCode(currentWx))
      : fetchState === "loading" ? "Loading…"
      : placeCode === null ? "—" : condLabel(placeCode);
    infoTemp.textContent = placeTemp === null ? "" : Math.round(placeTemp) + "°C";
  }else{
    infoCond.textContent = condLabel(wxToCode(currentWx));
    infoTemp.textContent = "";
  }

  const age = lastFetchAt ? Math.round((Date.now() - lastFetchAt) / 60000) : null;
  infoMeta.textContent = (!place || !wxAuto) ? "Weather set by hand"
    : fetchState === "error" ? "Offline · last known"
    : fetchState !== "ok" ? "Fetching…"
    : "Open-Meteo" + (age === null ? "" : " · " + (age < 1 ? "just now" : age + "m ago"));

  const differs = Math.abs(hour - realH) > 0.12;
  infoScene.hidden = !differs;
  if(differs) infoScene.textContent = "Scene " + fmtHour(hour) + (cycleOn ? " · cycling" : "");

  const busy = fetchState === "loading" && !!place;
  infoRefresh.disabled = !place;
  infoRefresh.classList.toggle("spin", busy);
  infoRefresh.title = place ? "Refresh this city now" : "Pick a location to refresh its weather";
  infoHead.setAttribute("aria-expanded", String(!info.classList.contains("closed")));
}

function refreshNow(){
  if(placeIx === null || fetchState === "loading") return;
  if(!cycleOn){                                  // re-sync the sky to the city's real clock too
    hour = localHour(PLACES[placeIx].tz);
    hourInput.value = hour.toFixed(2);
    updateClock();
  }
  refreshPlaceWeather();
}

function setInfoOpen(open){
  info.classList.toggle("closed", !open);
  infoHead.setAttribute("aria-expanded", String(open));
  updateInfo();
  savePrefs();
}
infoHead.addEventListener("click", () => setInfoOpen(info.classList.contains("closed")));
infoHead.addEventListener("keydown", e => {
  if(e.target !== infoHead) return;          // let the refresh button handle its own keys
  if(e.key !== "Enter" && e.key !== " ") return;
  e.preventDefault();
  setInfoOpen(info.classList.contains("closed"));
});
infoRefresh.addEventListener("click", e => {
  e.stopPropagation();                 // don't also collapse the card
  refreshNow();
});
setInterval(updateInfo, 1000);

// keep the chosen city's clock honest, and refresh its weather now and then
setInterval(() => {
  if(placeIx === null) return;
  const t = localHour(PLACES[placeIx].tz);
  if(Math.abs(t - hour) > 0.02 && !cycleOn){
    hour = t;
    hourInput.value = hour.toFixed(2);
    updateClock();
  }
}, 30000);
setInterval(() => { if(placeIx !== null && wxAuto) refreshPlaceWeather(); }, 15 * 60 * 1000);


sndBtn.addEventListener("click", async () => {
  if(!audioInit()) return;
  try { await ac.resume(); } catch(e){}
  if(soundOn) stopSound(); else startSound();
  sndBtn.setAttribute("aria-pressed", String(soundOn));
  sndBtn.textContent = soundOn ? "sound on" : "sound";
});

volInput.addEventListener("input", () => {
  vol = parseFloat(volInput.value);
  if(ac && soundOn) master.gain.setTargetAtTime(vol * 0.5, ac.currentTime, 0.2);
  savePrefs();
});

function nudgeZoom(factor){
  zoomTarget = clamp(zoomTarget * factor, ZOOM_MIN, ZOOM_MAX);
  savePrefsSoon();
}
zinBtn.addEventListener("click", () => nudgeZoom(1.18));
zoutBtn.addEventListener("click", () => nudgeZoom(1 / 1.18));

/* remember the last look so the page opens the way it was left */
const PREF_KEY = "pagoda-garden.v4";
let currentWx = "clear";
let prefTimer = 0;
function savePrefsSoon(){ clearTimeout(prefTimer); prefTimer = setTimeout(savePrefs, 600); }
function savePrefs(){
  try {
    localStorage.setItem(PREF_KEY, JSON.stringify({
      hour, cycleOn, wx: currentWx, vol, zoom: +zoomTarget.toFixed(3), place: placeIx,
      infoOpen: !info.classList.contains("closed")
    }));
  } catch(e){}
}
function loadPrefs(){
  let p = null;
  try { p = JSON.parse(localStorage.getItem(PREF_KEY) || "null"); } catch(e){}
  if(!p) return;
  if(Number.isFinite(p.hour)) hour = p.hour;
  if(typeof p.cycleOn === "boolean") cycleOn = p.cycleOn;
  if(typeof p.vol === "number"){ vol = p.vol; volInput.value = String(vol); }
  if(Number.isFinite(p.zoom)){ zoom = zoomTarget = clamp(p.zoom, ZOOM_MIN, ZOOM_MAX); }
  if(typeof p.infoOpen === "boolean"){ info.classList.toggle("closed", !p.infoOpen); }
  hourInput.value = hour.toFixed(2);
  cycleBtn.setAttribute("aria-pressed", String(cycleOn));
  updateClock();
  setWeather(typeof p.wx === "string" ? p.wx : "clear");
  if(Number.isInteger(p.place) && PLACES[p.place]) selectPlace(p.place);
  updateInfo();
}
loadPrefs();
setTimeout(() => { hint.style.opacity = "0"; }, 14000);

/* -------------------------------------------------------------------- loop */
const pointers = new Map();
let pinchStart = 0, pinchZoom = 1;

function pinchDistance(){
  const p = Array.from(pointers.values());
  return Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 0;
}

cv.addEventListener("pointerdown", e => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  cv.setPointerCapture(e.pointerId);
  lastTouch = performance.now();
  hint.style.opacity = "0";
  if(pointers.size === 2){
    pinchStart = pinchDistance();
    pinchZoom = zoomTarget;
    dragging = false;
    return;
  }
  dragging = true; lx = e.clientX; ly = e.clientY; vel = 0;
  cv.style.cursor = "grabbing";
});
cv.addEventListener("pointermove", e => {
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if(pointers.size >= 2){
    if(pinchStart > 0) zoomTarget = clamp(pinchZoom * (pinchDistance() / pinchStart), ZOOM_MIN, ZOOM_MAX);
    lastTouch = performance.now();
    return;
  }
  if(!dragging) return;
  const dx = e.clientX - lx, dy = e.clientY - ly;
  lx = e.clientX; ly = e.clientY;
  yaw += dx * 0.010;
  vel = clamp(dx * 0.030, -1.6, 1.6);
  pitch = clamp(pitch - dy * 0.006, 0.20, 1.15);
  lastTouch = performance.now();
});
function endDrag(e){
  savePrefsSoon();
  if(e && e.pointerId !== undefined){
    pointers.delete(e.pointerId);
    if(pointers.size < 2) pinchStart = 0;
    if(pointers.size === 1){                       // back to a single finger: resume panning
      const p = Array.from(pointers.values())[0];
      lx = p.x; ly = p.y; dragging = true; vel = 0;
      return;
    }
  }
  dragging = false; cv.style.cursor = "grab"; lastTouch = performance.now();
}
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);

cv.addEventListener("wheel", e => {
  e.preventDefault();
  zoomTarget = clamp(zoomTarget * Math.exp(-e.deltaY * 0.0016), ZOOM_MIN, ZOOM_MAX);
  lastTouch = performance.now();
  hint.style.opacity = "0";
  savePrefsSoon();
}, { passive: false });

cv.addEventListener("dblclick", () => { zoomTarget = 1; savePrefsSoon(); });
addEventListener("keydown", e => {
  if(e.target && /input|textarea|select/i.test(e.target.tagName)) return;
  if(e.key === "+" || e.key === "="){ zoomTarget = clamp(zoomTarget * 1.15, ZOOM_MIN, ZOOM_MAX); }
  else if(e.key === "-" || e.key === "_"){ zoomTarget = clamp(zoomTarget / 1.15, ZOOM_MIN, ZOOM_MAX); }
  else if(e.key === "0"){ zoomTarget = 1; }
  else return;
  e.preventDefault();
  savePrefsSoon();
});

let last = performance.now();

// A constant, very slow turn: it is always on, eases out while you drag and eases
// back in afterwards, so the scene never sits still and never fights your hand.
const DRIFT_RATE = 0.042;          // rad/s -> a full turn every ~150 s
let drift = 1;                     // 0..1 blend of that turn

function tick(now){
  const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
  last = now;

  if(cycleOn){
    hour = (hour + dt * (24 / 420)) % 24;      // full day in seven minutes
    hourInput.value = hour.toFixed(2);
    updateClock();
  }

  // fling after a drag, then the ambient turn
  if(!dragging && Math.abs(vel) > 0.001){
    yaw += vel * dt;
    vel *= Math.exp(-3.2 * dt);
  }
  drift += ((dragging ? 0 : 1) - drift) * Math.min(1, dt * (dragging ? 14 : 0.7));
  if(!reduceMotion && drift > 0.002) yaw += DRIFT_RATE * drift * dt;

  if(Math.abs(zoomTarget - zoom) > 0.0008) zoom += (zoomTarget - zoom) * Math.min(1, dt * 9);

  updateWeather(dt);
  updateAudio();
  const active = !reduceMotion || rainAmt > 0.01 || snowAmt > 0.01 || moodAt(hour).night > 0.10 ||
                 Math.abs(zoomTarget - zoom) > 0.0008 || dragging || Math.abs(vel) > 0.001;
  render(now, dt, active);
  requestAnimationFrame(tick);
}

resize();
requestAnimationFrame(tick);
</script>
